app = 'prophet'
primary_region = 'sjc'

[build]

[[mounts]]
  source = 'data'
  destination = '/root'
  initial_size = '128gb'

[[services]]
  internal_port = 2222
  protocol = "tcp"
  auto_stop_machines = true
  auto_start_machines = true
  [[services.ports]]
    port = 22

[[vm]]
  size = 'a100-80gb'
  memory = '128gb'
  cpu_kind = 'performance'
  cpus = 16
  gpus = 2
  gpu_kind = 'a100-sxm4-80gb'
